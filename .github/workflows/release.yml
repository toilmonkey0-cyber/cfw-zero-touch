name: Release

# A v* tag builds the Windows installer, writes SHA256SUMS, and opens a
# draft GitHub release. workflow_dispatch with dry_run builds the same
# artifact and stops there. Publishing the draft is a step a person does
# in the browser.
#
# Signing stays off unless the repository variable SIGNING_ENABLED is
# exactly true AND this run is a push of a v* tag. A workflow_dispatch
# dry run always builds unsigned. On a signed tag, compile and bundle
# never receive the release environment. Two later jobs check out
# scripts/ only, verify the previous job's hashes, and sign. This file
# has no trigger for pull requests or forks.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the installer and upload SHA256SUMS. A draft release is created only by a v* tag."
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Dry-run guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: none
    steps:
      - name: Refuse a dispatch that is not a dry run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          echo "Run this workflow with dry_run set. Push a v* tag when you want a draft release."
          exit 1
      - name: Record the trigger
        shell: bash
        run: echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
      - name: Reject an unknown signing method
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ENABLED == 'true' && vars.SIGNING_METHOD != '' && vars.SIGNING_METHOD != 'pfx' && vars.SIGNING_METHOD != 'azure'
        shell: bash
        run: |
          echo "SIGNING_METHOD must be empty, pfx, or azure. Refusing to sign."
          exit 1

  unsigned:
    name: Windows installer (unsigned)
    needs: guard
    if: "${{ vars.SIGNING_ENABLED != 'true' || github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}"
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain. 1.99.1 is the stable rustc CI resolved on 2026-10-21.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm ci
      - name: Sign Windows binaries
        id: sign
        if: vars.SIGNING_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Write-Error "The unsigned job must not sign. Certificate material is not available here."
          exit 1
      - name: Build unsigned installer
        shell: pwsh
        env:
          SIGNING_ENABLED: 'false'
          SIGN_STEP_OUTCOME: ${{ steps.sign.outcome }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-windows.ps1 -Mode build
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  compile:
    name: Compile Windows binaries
    needs: guard
    if: vars.SIGNING_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.compile.outputs.hashes }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain. 1.99.1 is the stable rustc CI resolved on 2026-10-21.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm ci
      - name: Compile without bundling
        id: compile
        shell: pwsh
        env:
          SIGNING_ENABLED: 'false'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-windows.ps1 -Mode compile
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-binaries
          path: release/binaries
          if-no-files-found: error
          retention-days: 14

  sign-binaries:
    name: Sign Windows binaries
    needs: compile
    if: needs.compile.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.pfx.outputs.hashes }}${{ steps.azure.outputs.hashes }}
    steps:
      # actions/checkout v4.2.2. scripts/ only. No toolchain and no dependencies.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-binaries
          path: release/binaries
      - name: Sign release executables
        id: pfx
        if: vars.SIGNING_METHOD == '' || vars.SIGNING_METHOD == 'pfx'
        shell: pwsh
        env:
          SIGNING_ENABLED: 'true'
          SIGNING_METHOD: pfx
          EXPECTED_HASHES: ${{ needs.compile.outputs.hashes }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-windows.ps1 -Mode sign-binaries
      - name: Sign release executables with Azure Artifact Signing
        id: azure
        if: vars.SIGNING_METHOD == 'azure'
        shell: pwsh
        env:
          SIGNING_ENABLED: 'true'
          SIGNING_METHOD: azure
          EXPECTED_HASHES: ${{ needs.compile.outputs.hashes }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_DLIB_URL: ${{ vars.AZURE_DLIB_URL }}
          AZURE_DLIB_SHA256: ${{ vars.AZURE_DLIB_SHA256 }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-windows.ps1 -Mode sign-binaries
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-binaries-signed
          path: release/binaries
          if-no-files-found: error
          retention-days: 14
      - name: Remove imported code-signing certificate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath ./scripts/release-lib.ps1)) { exit 0 }
          . ./scripts/release-lib.ps1
          Remove-ImportedCodeSigningCertificate

  bundle:
    name: Bundle Windows installers
    needs: sign-binaries
    if: needs.sign-binaries.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.bundle.outputs.hashes }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain. 1.99.1 is the stable rustc CI resolved on 2026-10-21.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.1
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm ci
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-binaries-signed
          path: src-tauri/target/release
      - name: Bundle signed executables
        id: bundle
        shell: pwsh
        env:
          SIGNING_ENABLED: 'false'
          EXPECTED_HASHES: ${{ needs.sign-binaries.outputs.hashes }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-windows.ps1 -Mode bundle
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          path: release/installers
          if-no-files-found: error
          retention-days: 14

  sign-installers:
    name: Sign Windows installers
    needs: bundle
    if: needs.bundle.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2. scripts/ only. No toolchain and no dependencies.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installers
          path: release
      - name: Sign Windows installers
        id: pfx
        if: vars.SIGNING_METHOD == '' || vars.SIGNING_METHOD == 'pfx'
        shell: pwsh
        env:
          SIGNING_ENABLED: 'true'
          SIGNING_METHOD: pfx
          EXPECTED_HASHES: ${{ needs.bundle.outputs.hashes }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-windows.ps1 -Mode sign-installers
      - name: Sign Windows installers with Azure Artifact Signing
        id: azure
        if: vars.SIGNING_METHOD == 'azure'
        shell: pwsh
        env:
          SIGNING_ENABLED: 'true'
          SIGNING_METHOD: azure
          EXPECTED_HASHES: ${{ needs.bundle.outputs.hashes }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_DLIB_URL: ${{ vars.AZURE_DLIB_URL }}
          AZURE_DLIB_SHA256: ${{ vars.AZURE_DLIB_SHA256 }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-windows.ps1 -Mode sign-installers
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove imported code-signing certificate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath ./scripts/release-lib.ps1)) { exit 0 }
          . ./scripts/release-lib.ps1
          Remove-ImportedCodeSigningCertificate

  release:
    name: Draft GitHub release
    needs: [unsigned, sign-installers]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.unsigned.result == 'success' || needs.sign-installers.result == 'success') &&
      needs.unsigned.result != 'failure' &&
      needs.sign-installers.result != 'failure' &&
      needs.unsigned.result != 'cancelled' &&
      needs.sign-installers.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: release-files
      - name: Open a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Refusing to create a release for event ${GITHUB_EVENT_NAME}." >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "Refusing to create a release from ${GITHUB_REF}." >&2
              exit 1
              ;;
          esac
          case "$TAG" in
            v*) ;;
            *)
              echo "Refusing to create a release for tag ${TAG}." >&2
              exit 1
              ;;
          esac

          label="$(tr -d '\r\n' < release-files/SIGNING.txt)"
          case "$label" in
            unsigned|signed) ;;
            *)
              echo "SIGNING.txt must say unsigned or signed." >&2
              exit 1
              ;;
          esac
          if [ ! -f release-files/SHA256SUMS ]; then
            echo "SHA256SUMS is missing." >&2
            exit 1
          fi
          if ! grep -Eq '^[0-9a-f]{64}  .+' release-files/SHA256SUMS; then
            echo "SHA256SUMS is empty or malformed." >&2
            exit 1
          fi
          if [ "$label" = "unsigned" ]; then
            grep -q 'This build is UNSIGNED' release-files/RELEASE_NOTES.md
          else
            grep -q 'This build is SIGNED' release-files/RELEASE_NOTES.md
          fi

          shopt -s nullglob
          msi=(release-files/*.msi)
          exe=(release-files/*.exe)
          files=(release-files/*)
          shopt -u nullglob
          if [ "${#msi[@]}" -lt 1 ] || [ "${#exe[@]}" -lt 1 ]; then
            echo "The draft needs a .msi and a .exe." >&2
            exit 1
          fi

          assets=()
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if [ "$name" = "RELEASE_NOTES.md" ]; then
              continue
            fi
            assets+=("$file")
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release named ${TAG} already exists. Refusing to change it." >&2
            exit 1
          fi

          title="CFW Card Studio ${TAG} (${label})"
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --latest=false \
            --title "$title" \
            --notes-file release-files/RELEASE_NOTES.md \
            -- "${assets[@]}"

          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "The release is not a draft." >&2
            exit 1
          fi

          {
            echo "## Draft release"
            echo
            echo "Tag \`${TAG}\` is a draft. This workflow stopped before publish."
            echo
            if [ "$label" = "unsigned" ]; then
              echo "This build is **UNSIGNED**."
            else
              echo "This build is **SIGNED**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Draft release ${TAG} is ready."
