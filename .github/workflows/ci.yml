name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # dtolnay/rust-toolchain (stable branch head at pin time)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri

  frontend:
    runs-on: windows-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:unit
      - name: npm audit (warning only)
        continue-on-error: true
        run: npm audit

  # Advisory, license, ban, and source checks. Findings are reported and do not fail CI.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # EmbarkStudios/cargo-deny-action v2.1.1 (cargo-deny 0.20.2). Docker action, so this job is Linux.
      - name: cargo deny (warning only)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

  # Unsigned installer for pull requests only. No certificate, updater key, or other secrets.
  windows-installer:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # dtolnay/rust-toolchain (stable branch head at pin time)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Unsigned tauri build
        run: npm run tauri build
      - name: Require an msi and an exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = @(Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter *.msi -ErrorAction SilentlyContinue)
          $exe = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe -ErrorAction SilentlyContinue)
          if ($msi.Count -lt 1 -or $exe.Count -lt 1) {
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw "unsigned tauri build did not produce both a .msi and a .exe"
          }
          $msi | ForEach-Object { "msi: $($_.FullName)" }
          $exe | ForEach-Object { "exe: $($_.FullName)" }
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
